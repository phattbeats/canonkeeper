name: ci

on:
  push:
  pull_request:

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The gate must never pass by vacancy. The fixtures are committed, and
      # this fails if any of them is untracked or gitignored.
      - name: Fixtures are committed
        run: |
          git ls-files --error-unmatch \
            fixtures/story/transcript.jsonl \
            fixtures/story/answer-key.json \
            fixtures/story/reference/book.json \
            fixtures/story/reference/rerun.json \
            fixtures/story/reference/scenes.json \
            fixtures/story/broken-collision/book.json \
            fixtures/story/recorded/replies.json \
            fixtures/story/edits/undercroft/transcript.jsonl \
            fixtures/story/edits/undercroft/replies.json \
            fixtures/story/chunked/replies.json

      # The gate steps below run even if the tests fail, so each signal is
      # reported on its own.
      - name: Unit tests (each check shown red on a broken book)
        run: npm test

      - name: Gate on the reference run must be green
        if: ${{ !cancelled() }}
        run: node harness/gate.js --story fixtures/story --run fixtures/story/reference

      # The builder itself, end to end: a model reply recorded from a real
      # run is replayed through the core, two human pins are simulated, the
      # book is re-run unchanged (I5/I6) and updated for a one-scene edit with
      # a second recorded reply (E9), and the gate scores it all. No model
      # call in CI.
      - name: Gate on the builder's own output must be green
        if: ${{ !cancelled() }}
        run: npm run build:story

      # The chunked fallback: the same story on a window too small for it,
      # replayed from a real chunked run (two parts and a reconciliation).
      # The invariants I1-I6 must hold and K10 must find the run flagged as
      # chunked, its parts covering every message once.
      - name: Gate on a chunked build must be green
        if: ${{ !cancelled() }}
        run: npm run build:chunked

      # K10 has to be able to fail: the one-shot run above must not pass as
      # chunked. Exit 1 (red) is required.
      - name: A one-shot run gated as chunked must be red
        if: ${{ !cancelled() }}
        run: |
          set +e
          node harness/gate.js --story fixtures/story --run .run/story --chunked
          code=$?
          if [ "$code" -ne 1 ]; then echo "expected exit 1 (red), got $code"; exit 1; fi

      # Negative control: the gate has to be able to fail. Exit 1 (red) is
      # required here; 0 (a pass) or 2 (fixture error) both fail the job.
      - name: Gate on the broken book must be red
        if: ${{ !cancelled() }}
        run: |
          set +e
          node harness/gate.js --story fixtures/story --run fixtures/story/broken-collision
          code=$?
          if [ "$code" -ne 1 ]; then echo "expected exit 1 (red), got $code"; exit 1; fi
